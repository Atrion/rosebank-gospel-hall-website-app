version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    # Library updates arrive together in one proposal so they can be tested together.
    groups:
      libraries:
        patterns:
          - "*"
        exclude-patterns:
          - "com.android.application"
          - "org.jetbrains.kotlin.android"
    # Build tool major versions are upgraded deliberately, not automatically.
    ignore:
      - dependency-name: "com.android.application"
        update-types: ["version-update:semver-major"]
      - dependency-name: "org.jetbrains.kotlin.android"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
