name: Build and release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 8.14.3
      - name: Read version
        id: ver
        run: |
          N=$(grep -E '^val releaseNumber' app/build.gradle.kts | grep -oE '[0-9]+')
          echo "name=$((N / 100)).$(printf '%02d' $((N % 100)))" >> "$GITHUB_OUTPUT"
      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "::notice title=Signing::The APK and app bundle will be signed with your release key."
          else
            echo "::warning title=Signing::No release key found. The APK will use a temporary key and no app bundle will be published."
          fi
      - name: Build APK and app bundle
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease bundleRelease -PrequireIcon
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.ver.outputs.name }}
        run: |
          APK="RosebankGospelHallApp-$VERSION.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          ASSETS=("$APK")
          AAB=""
          if [ -n "${KEYSTORE_FILE:-}" ]; then
            AAB="RosebankGospelHallApp-$VERSION.aab"
            cp app/build/outputs/bundle/release/app-release.aab "$AAB"
            ASSETS+=("$AAB")
          fi
          awk -v v="## $VERSION" '$0 == v {f=1; next} /^## / {f=0} f' CHANGELOG.md > changes.md
          if [ ! -s changes.md ]; then
            echo "::warning title=Changelog::CHANGELOG.md has no entry for version $VERSION"
            echo "Version $VERSION" > changes.md
          fi
          SUM=$(sha256sum "$APK" | cut -d ' ' -f 1)
          {
            cat changes.md
            echo
            echo "---"
            echo
            echo "**Install:** download \`$APK\` on your Android phone (Android 8.0 or newer), open it, and allow installs from your browser if asked."
            echo
            echo "**Updating:** installs over the previous version and keeps your saved posts."
            echo
            echo "**SHA-256:** \`$SUM\`"
            if [ -n "$AAB" ]; then
              echo
              echo "**Google Play file:** \`$AAB\` is the app bundle for the Play Console. It cannot be installed directly."
            fi
          } > notes.md
          if gh release view "v$VERSION" > /dev/null 2>&1; then
            echo "::notice title=Release::v$VERSION already exists and was left unchanged. Raise the release number to publish a new version."
          else
            gh release create "v$VERSION" "${ASSETS[@]}" --title "Version $VERSION" --notes-file notes.md --target "$GITHUB_SHA" --latest
          fi
      - name: Keep the Play Store icon
        uses: actions/upload-artifact@v7
        with:
          name: play-store-icon
          path: app/build/play/icon-512.png
