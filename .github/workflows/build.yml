name: Build and release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 8.14.3
      - name: Read version
        id: ver
        run: |
          N=$(grep -E '^val releaseNumber' app/build.gradle.kts | grep -oE '[0-9]+')
          echo "name=$((N / 100)).$(printf '%02d' $((N % 100)))" >> "$GITHUB_OUTPUT"
      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "::notice title=Signing::The APK and app bundle will be signed with your release key."
          else
            echo "::warning title=Signing::No release key found. The APK will use a temporary key and no app bundle will be published."
          fi
      - name: Build APK and app bundle
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease bundleRelease -PrequireIcon
      - name: Publish release
        id: pub
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.ver.outputs.name }}
        run: |
          APK="RosebankGospelHallApp-$VERSION.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          AAB=""
          if [ -n "${KEYSTORE_FILE:-}" ]; then
            AAB="RosebankGospelHallApp-$VERSION.aab"
            cp app/build/outputs/bundle/release/app-release.aab "$AAB"
          fi
          awk -v v="## $VERSION" '$0 == v {f=1; next} /^## / {f=0} f' CHANGELOG.md > changes.md
          if [ ! -s changes.md ]; then
            echo "::warning title=Changelog::CHANGELOG.md has no entry for version $VERSION"
            echo "Version $VERSION" > changes.md
          fi
          SUM=$(sha256sum "$APK" | cut -d ' ' -f 1)
          {
            cat changes.md
            echo
            echo "---"
            echo
            echo "**Install:** download \`$APK\` on your Android phone (Android 8.0 or newer), open it, and allow installs from your browser if asked."
            echo
            echo "**Updating:** installs over the previous version and keeps your saved posts."
            echo
            echo "**SHA-256:** \`$SUM\`"
          } > notes.md
          if gh release view "v$VERSION" > /dev/null 2>&1; then
            echo "::notice title=Release::v$VERSION already exists and was left unchanged. Raise the release number to publish a new version."
          else
            gh release create "v$VERSION" "$APK" --title "Version $VERSION" --notes-file notes.md --target "$GITHUB_SHA" --latest
            echo "new=true" >> "$GITHUB_OUTPUT"
            if [ -n "$AAB" ]; then
              # A draft release is visible only to people with write access to the repository.
              gh release create "play-v$VERSION" "$AAB" --draft --title "Google Play bundle $VERSION (private)" --notes "Private file for the Play Console. Upload it there, then delete this draft. Never click Publish on it." --target "$GITHUB_SHA"
              echo "::notice title=Google Play::The app bundle is in a private draft release named play-v$VERSION."
            else
              echo "::warning title=Google Play::No release key was found, so no app bundle was made."
            fi
          fi
      - name: Check Google Play upload settings
        id: play
        env:
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$PLAY_JSON" ] && [ -n "${KEYSTORE_FILE:-}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=Google Play::Automatic upload is off (no PLAY_SERVICE_ACCOUNT_JSON secret or no release key)."
          fi
      - name: Prepare Google Play release notes
        if: steps.pub.outputs.new == 'true' && steps.play.outputs.enabled == 'true'
        run: |
          mkdir -p whatsnew
          python3 - <<'PY'
          lines = open("changes.md").read().splitlines()
          lines = [("• " + l[2:]) if l.startswith("- ") else l for l in lines if l.strip() and not l.startswith("#")]
          out = ""
          for l in lines:
              if len(out) + len(l) + 1 > 480:
                  break
              out += l + "\n"
          open("whatsnew/whatsnew-en-CA", "w").write(out.strip())
          PY
      - name: Upload to Google Play (internal testing)
        if: steps.pub.outputs.new == 'true' && steps.play.outputs.enabled == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ca.rosebankgospelhall.app
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          track: internal
          # Use "draft" until the app is fully set up in Play Console, then change to "completed".
          status: draft
          releaseName: ${{ steps.ver.outputs.name }}
          whatsNewDirectory: whatsnew
      - name: Keep the Play Store icon
        uses: actions/upload-artifact@v7
        with:
          name: play-store-icon
          path: app/build/play/icon-512.png
          retention-days: 14
